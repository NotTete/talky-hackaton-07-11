# Paths and phase selection. Everything else (rules, tolerances) lives in code so
# you can read the rule next to the line that applies it.

[paths]
# Where scripts/download_data.py puts archives/, masters/ and the phase dirs.
data_dir = "data"
builds_dir = "builds"

[run]
# sample | train | live | final
phase = "sample"
# Item tables to load. sample -> ["sample"]; live -> ["train", "live"].
item_phases = ["sample"]
# Use PDF facts as extra evidence (build them first: `bankrec pdf-facts --phase sample`).
use_pdf_facts = false
